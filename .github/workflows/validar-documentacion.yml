name: Validar documentación

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  enlaces:
    name: Revisar enlaces internos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener archivos del pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Comprobar enlaces en Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: "--offline --no-progress './**/*.md'"
